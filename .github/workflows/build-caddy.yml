name: Build and Push Caddy OVH

on:
  schedule:
    - cron: '0 */12 * * *' # Toutes les 12h pour suivre rapidement les releases Caddy
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-caddy.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve latest Caddy version
        id: caddy
        env:
          CADDY_REPO: caddyserver/caddy
        run: |
          set -euo pipefail

          latest_tag="$(curl -fsSL "https://api.github.com/repos/${CADDY_REPO}/releases/latest" | jq -r '.tag_name')"
          if [ -z "$latest_tag" ] || [ "$latest_tag" = "null" ]; then
            echo "Unable to resolve latest Caddy release tag" >&2
            exit 1
          fi

          caddy_version="${latest_tag#v}"
          if [ -z "$caddy_version" ]; then
            echo "Unable to normalize Caddy version from tag: $latest_tag" >&2
            exit 1
          fi

          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "version=$caddy_version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/caddy-ovh
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.caddy.outputs.version }}
            type=raw,value=caddy-${{ steps.caddy.outputs.tag }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          build-args: |
            CADDY_VERSION=${{ steps.caddy.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
