name: Build and Push Caddy OVH

on:
  schedule:
    - cron: '0 22 * * 0'  # Tous les dimanches à 22h
  workflow_dispatch:      # Permet de lancer manuellement
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve upstream versions
        id: upstream
        run: |
          set -euo pipefail

          digest_for() {
            local image="$1"
            local digest=""
            if digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
              echo "$digest"
              return 0
            fi
            docker buildx imagetools inspect "$image" --format '{{.Digest}}'
          }

          caddy_latest_digest="$(digest_for caddy:latest)"
          caddy_builder_digest="$(digest_for caddy:builder)"
          ovh_version="$(git ls-remote --tags https://github.com/caddy-dns/ovh.git \
            | awk -F/ '/refs\/tags\/v?[0-9]/{print $3}' \
            | sort -V \
            | tail -n1)"
          if [ -z "${ovh_version}" ]; then
            ovh_version="$(git ls-remote https://github.com/caddy-dns/ovh.git HEAD | awk '{print $1}')"
          fi
          echo "caddy_latest_digest=${caddy_latest_digest}" >> "$GITHUB_OUTPUT"
          echo "caddy_builder_digest=${caddy_builder_digest}" >> "$GITHUB_OUTPUT"
          echo "ovh_version=${ovh_version}" >> "$GITHUB_OUTPUT"
      
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/caddy-ovh
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
