name: Build and Push Caddy OVH

on:
  schedule:
    - cron: '0 6 * * 1'  # Toutes les heures pour suivre les images latest
  workflow_dispatch:      # Permet de lancer manuellement
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-caddy.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/caddy-ovh
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve upstream versions
        id: upstream
        run: ./scripts/resolve-upstream-info.sh

      - name: Check whether rebuild is needed
        id: check
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/caddy-ovh:latest"
          if docker pull "${image}"; then
            existing_caddy_latest="$(docker image inspect "${image}" --format '{{ index .Config.Labels "org.opencontainers.image.base.caddy.latest" }}')"
            existing_caddy_builder="$(docker image inspect "${image}" --format '{{ index .Config.Labels "org.opencontainers.image.base.caddy.builder" }}')"
            existing_ovh_version="$(docker image inspect "${image}" --format '{{ index .Config.Labels "org.opencontainers.image.base.ovh.version" }}')"
            existing_sablier_version="$(docker image inspect "${image}" --format '{{ index .Config.Labels "org.opencontainers.image.base.sablier.version" }}')"
          else
            existing_caddy_latest=""
            existing_caddy_builder=""
            existing_ovh_version=""
            existing_sablier_version=""
          fi
          if [ "${existing_caddy_latest}" = "${{ steps.upstream.outputs.caddy_latest_digest }}" ] \
            && [ "${existing_caddy_builder}" = "${{ steps.upstream.outputs.caddy_builder_digest }}" ] \
            && [ "${existing_ovh_version}" = "${{ steps.upstream.outputs.ovh_version }}" ] \
            && [ "${existing_sablier_version}" = "${{ steps.upstream.outputs.sablier_version }}" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi
      
      - name: Login to GHCR
        if: steps.check.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        if: steps.check.outputs.should_build == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=build-${{ github.run_number }}
            type=sha

      - name: Build and push
        if: steps.check.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.base.caddy.latest=${{ steps.upstream.outputs.caddy_latest_digest }}
            org.opencontainers.image.base.caddy.builder=${{ steps.upstream.outputs.caddy_builder_digest }}
            org.opencontainers.image.base.ovh.version=${{ steps.upstream.outputs.ovh_version }}
            org.opencontainers.image.base.sablier.version=${{ steps.upstream.outputs.sablier_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
